; Graphics settings overlay for XCOM: Enemy Unknown / Enemy Within.
;
; apply.ps1 merges these values into the game's Engine\Config\BaseEngine.ini. Only the
; settings listed here change; every other line of the game file stays as it was.
; Each setting is a plain Key=Value in its [Section]. UE3 array syntax (+Key, -Key,
; .Key, !Key) is not supported here and is rejected.
;
; The comment above each setting says what it does, followed by the stock value.

[Engine.Engine]
; Let PhysX use hardware (GPU) acceleration when the system supports it, instead of
; forcing software physics. Stock: True
bDisablePhysXHardwareSupport=False

[XAudio2.XAudio2Device]
; Maximum number of sounds that can play at once (XAudio2, the Windows audio device). Stock: 32
MaxChannels=96

[ALAudio.ALAudioDevice]
; Maximum number of sounds that can play at once (OpenAL audio device). Stock: 32
MaxChannels=96

[SystemSettings]
; Higher-quality filtering of fog-of-war edges. Stock: False
bHighQualityFOWFiltering=True
; Post-processing quality level. Stock: 0
PostProcessQuality=2
; FXAA anti-aliasing quality level. Stock: 1
FXAAQuality=2
; Allow the DirectX 11 renderer. Stock: False
AllowD3D11=True
; Subsurface scattering: light passing through skin and other translucent surfaces. Stock: False
AllowSubsurfaceScattering=True
; Multiplier on how far away objects are still drawn. Stock: 1
MaxDrawDistanceScale=2
; Anisotropic filtering level: sharper textures at shallow angles. Stock: 4
MaxAnisotropy=16
; Largest shadow map for a single object's shadow. Stock: 1120
MaxShadowResolution=2048
; Largest shadow map for the whole-scene shadow from the main (dominant) light. Stock: 1344
MaxWholeSceneDominantShadowResolution=2048
; Default window width. No effect: XComGame\Config\DefaultEngine.ini sets ResX=0 (the
; desktop resolution), which wins over this file. Stock: 1280
ResX=1920
; Default window height. No effect: XComGame\Config\DefaultEngine.ini sets ResY=0 (the
; desktop resolution), which wins over this file. Stock: 720
ResY=1080
; Variance shadow maps: softer, smoother shadow edges. Stock: False
bEnableVSMShadows=True
; Foreground objects cast shadows onto the world. Stock: False
bEnableForegroundShadowsOnWorld=True
; Foreground objects shadow themselves. Stock: False
bEnableForegroundSelfShadowing=True

; Texture filtering per texture group. MinMagFilter is the filter used when a texture is
; magnified or minified, MipFilter the filter between mipmap levels. Stock: MipFilter=point
; everywhere, and MinMagFilter=point for World and RenderTarget. Sizes and LOD bias are unchanged.
; World (level geometry) colour textures
TEXTUREGROUP_World=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; World normal maps
TEXTUREGROUP_WorldNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; World specular maps
TEXTUREGROUP_WorldSpecular=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Character colour textures
TEXTUREGROUP_Character=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Character normal maps
TEXTUREGROUP_CharacterNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Character specular maps
TEXTUREGROUP_CharacterSpecular=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Weapon colour textures
TEXTUREGROUP_Weapon=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Weapon normal maps
TEXTUREGROUP_WeaponNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Weapon specular maps
TEXTUREGROUP_WeaponSpecular=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Vehicle colour textures
TEXTUREGROUP_Vehicle=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Vehicle normal maps
TEXTUREGROUP_VehicleNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Vehicle specular maps
TEXTUREGROUP_VehicleSpecular=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Cutscene textures
TEXTUREGROUP_Cinematic=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Particle and effect textures
TEXTUREGROUP_Effects=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=linear,MipFilter=aniso)
; Effect textures marked as not filtered
TEXTUREGROUP_EffectsNotFiltered=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Sky textures
TEXTUREGROUP_Skybox=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; User interface textures
TEXTUREGROUP_UI=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Baked light maps
TEXTUREGROUP_Lightmap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Baked shadow maps
TEXTUREGROUP_Shadowmap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso,NumStreamedMips=3)
; Render targets (textures the game draws into at run time)
TEXTUREGROUP_RenderTarget=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Flattened textures made for mobile platforms
TEXTUREGROUP_MobileFlattened=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Procedural building facade textures
TEXTUREGROUP_ProcBuilding_Face=(MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Procedural building light maps
TEXTUREGROUP_ProcBuilding_LightMap=(MinLODSize=1,MaxLODSize=256,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Terrain height maps
TEXTUREGROUP_Terrain_Heightmap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
; Terrain layer weight maps
TEXTUREGROUP_Terrain_Weightmap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=aniso)
