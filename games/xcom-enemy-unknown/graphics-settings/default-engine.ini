; Texture filtering overlay for XCOM: Enemy Unknown / Enemy Within.
;
; apply.ps1 merges this into the game's XComGame\Config\DefaultEngine.ini, which sets its
; own [SystemSettings] texture groups on top of BaseEngine.ini, so base-engine.ini's texture
; filtering does not reach these groups.
;
; Each entry is Key.Field=Value: it changes only that field inside the key's
; (Field=...,Field=...) value. Each game's own sizes and LOD bias, and every other line,
; stay as they are. Field entries never add lines: a missing key or field is an error.
;
; MipFilter is the filter between mipmap levels. Stock: point in every group, which uses the
; nearest level and shows bands where detail drops with distance. linear blends the two
; nearest levels (trilinear filtering), the value Unreal Engine 3 documents for this field;
; GPUs have no anisotropic mode between levels. MinMagFilter is left as each game sets it
; (aniso, or linear for effects, specular, sky and UI textures).

[SystemSettings]
; Character colour textures
TEXTUREGROUP_Character.MipFilter=linear
; Character normal maps
TEXTUREGROUP_CharacterNormalMap.MipFilter=linear
; Character specular maps
TEXTUREGROUP_CharacterSpecular.MipFilter=linear
; Cutscene textures
TEXTUREGROUP_Cinematic.MipFilter=linear
; Particle and effect textures
TEXTUREGROUP_Effects.MipFilter=linear
; Effect textures marked as not filtered
TEXTUREGROUP_EffectsNotFiltered.MipFilter=linear
; Baked light and shadow maps
TEXTUREGROUP_LightAndShadowMap.MipFilter=linear
; Render targets (textures the game draws into at run time)
TEXTUREGROUP_RenderTarget.MipFilter=linear
; Sky textures
TEXTUREGROUP_Skybox.MipFilter=linear
; User interface textures
TEXTUREGROUP_UI.MipFilter=linear
; 3D user interface textures
TEXTUREGROUP_UI3D.MipFilter=linear
; Vehicle colour textures
TEXTUREGROUP_Vehicle.MipFilter=linear
; Vehicle normal maps
TEXTUREGROUP_VehicleNormalMap.MipFilter=linear
; Vehicle specular maps
TEXTUREGROUP_VehicleSpecular.MipFilter=linear
; Weapon colour textures
TEXTUREGROUP_Weapon.MipFilter=linear
; Weapon normal maps
TEXTUREGROUP_WeaponNormalMap.MipFilter=linear
; Weapon specular maps
TEXTUREGROUP_WeaponSpecular.MipFilter=linear
; World (level geometry) colour textures
TEXTUREGROUP_World.MipFilter=linear
; High-detail world colour textures
TEXTUREGROUP_WorldHIGH.MipFilter=linear
; World normal maps
TEXTUREGROUP_WorldNormalMap.MipFilter=linear
; World specular maps
TEXTUREGROUP_WorldSpecular.MipFilter=linear
